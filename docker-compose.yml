version: '3.8'

networks:
  twitter-network:
    driver: bridge

services:
  nats:
    image: nats:alpine
    command: [ "-js" ]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - twitter-network

  mongodb:
    image: mongo:6
    ports:
      - "27018:27017"
    networks:
      - twitter-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    networks:
      - twitter-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8085:8080"
    networks:
      - twitter-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - twitter-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - twitter-network

  # Observability
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/local-config.yaml
    networks:
      - twitter-network

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/observability/promtail.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - twitter-network

  tempo:
    image: grafana/tempo:2.2.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - twitter-network

  otel-collector:
    image: otel/opentelemetry-collector:0.87.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - prometheus
    networks:
      - twitter-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - twitter-network

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./infrastructure/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - twitter-network

  # Application Services
  twitte-service:
    build:
      context: .
      dockerfile: services/twitte-service/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PORT=8082
      - NATS_URL=nats://nats:4222
      - NATS_TWEET_SUBJECT=tweets
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
      - nats
      - elasticsearch
    networks:
      - twitter-network

  users-service:
    build:
      context: .
      dockerfile: services/users-service/Dockerfile
    environment:
      - PORT=8081
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=myrealm
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=mysecret
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "8081:8081"
    depends_on:
      - keycloak
      - postgres
    networks:
      - twitter-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - USERS_SERVICE_URL=http://users-service:8081
      - TWITTE_SERVICE_URL=http://twitte-service:8082
      - TIMELINE_SERVICE_URL=http://timeline-service:8083
    ports:
      - "8090:8090"
    depends_on:
      - users-service
      - twitte-service
      - timeline-service
    networks:
      - twitter-network

  timeline-service:
    build:
      context: .
      dockerfile: services/timeline-service/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PORT=8083
      - NATS_URL=nats://nats:4222
      - NATS_TWEET_SUBJECT=tweets
      - NATS_QUEUE_GROUP=timeline-group
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "8083:8083"
    depends_on:
      - mongodb
      - nats
    networks:
      - twitter-network
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - twitter-network

  search-indexer:
    build:
      context: .
      dockerfile: services/search-indexer/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_TWEET_SUBJECT=tweets
      - NATS_QUEUE_GROUP=search-indexer-group
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      - nats
      - elasticsearch
    networks:
      - twitter-network
