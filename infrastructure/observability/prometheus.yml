global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'services'
    static_configs:
      - targets: ['api-gateway:8090', 'users-service:8081', 'twitte-service:8082', 'timeline-service:8083']
